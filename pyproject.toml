[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "codex-goal-controller"
version = "0.1.0"
description = "A Python controller for Codex with resilient Goal resume and configurable output."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "softcucu" }]
dependencies = [
  "openai-codex>=0.144.4,<0.145",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
]

[project.scripts]
codex-goal = "codex_controller.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_controller"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["codex_controller"]

