[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "codex-goal-controller"
version = "0.2.3"
description = "A Python controller for Codex with resilient Goal resume and configurable output."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "softcucu" }]
dependencies = [
  "openai-codex>=0.144.4,<0.145",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
]

[project.scripts]
codex-goal = "codex_controller.cli:main"
codex-vuln-audit = "codex_controller.audit_cli:main"
codex-codeql-git-audit = "codex_controller.codeql_audit_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_controller"]

[tool.hatch.build.targets.wheel.force-include]
"src/prompts" = "codex_controller/prompts"
"codeql_cmake_split_db_semantic_v4.py" = "codex_controller/codeql_cmake_split_db_semantic_v4.py"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["codex_controller"]
